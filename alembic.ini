# Alembic config. The database URL is not stored here: it comes from DATABASE_URL
# (see migrations/env.py). New revisions: `alembic revision --rev-id 0002 -m "..."`.

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src
path_separator = os
timezone = UTC
